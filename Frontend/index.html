<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SISTEM ANALISIS SENTIMEN BETA</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      /* Reset dan Global */
      body {
        margin: 0;
        padding: 0;
        font-family: 'IBM Plex Mono', 'Roboto Mono', monospace; /* Monospaced for raw feel */
        background-color: #FFFFFF; /* Latar belakang putih */
        color: #000000; /* Teks hitam terang */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: auto; /* Izinkan scrolling jika konten melebihi layar */
      }

      .container {
        background-color: #F0F0F0; /* Blok latar belakang abu-abu terang */
        border: 2px solid #000000; /* Batas hitam tegas */
        padding: 40px;
        box-shadow: 8px 8px 0px #666666; /* Shadow abu-abu tegas agar terlihat di background putih */
        text-align: center;
        max-width: 700px;
        width: 90%;
        box-sizing: border-box;
        position: relative;
        margin: 20px;
      }

      /* Heading - Besar, tebal, uppercase, kontras tinggi */
      h1 {
        font-size: 2.8em;
        font-weight: 700;
        color: #000000; /* Judul hitam terang */
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 2px solid #333333; /* Garis bawah abu-abu gelap */
        padding-bottom: 10px;
        display: inline-block;
      }

      p {
        font-size: 1.0em;
        line-height: 1.6;
        color: #333333; /* Abu-abu gelap untuk paragraf */
        margin-bottom: 30px;
      }

      /* Textarea - Kontras, batas jelas */
      textarea {
        display: block;
        width: calc(100% - 24px);
        padding: 10px;
        margin: 20px auto;
        background-color: #FFFFFF; /* Putih */
        border: 2px solid #000000; /* Batas hitam tegas */
        color: #000000; /* Teks input hitam */
        font-family: 'IBM Plex Mono', 'Roboto Mono', monospace;
        font-size: 1em;
        resize: vertical;
        min-height: 120px;
        box-sizing: border-box;
        outline: none;
      }
      textarea:focus {
        border-color: #333333; /* Batas abu-abu gelap saat fokus */
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.3); /* Outer glow hitam */
      }

      /* Button - Blok, kontras tinggi */
      button {
        background-color: #000000; /* Tombol hitam */
        color: #FFFFFF; /* Teks putih kontras */
        padding: 12px 30px;
        border: 2px solid #666666; /* Border abu-abu tegas */
        font-size: 1.1em;
        font-weight: 700;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
        box-shadow: 4px 4px 0px #999999; /* Shadow abu-abu */
        margin-top: 15px;
      }

      button:hover {
        background-color: #333333; /* Latar abu-abu gelap saat hover */
        color: #FFFFFF; /* Teks putih saat hover */
        box-shadow: 4px 4px 0px #000000; /* Shadow hitam saat hover */
      }

      button:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #666666;
      }

      /* Result Display - Kontras, batas tegas */
      #hasil-prediksi {
        margin-top: 40px;
        padding: 20px;
        background-color: #FFFFFF; /* Latar belakang hasil putih */
        border: 2px solid #000000; /* Border hitam solid */
        font-size: 1.6em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        word-break: break-word;
        /* Gaya khusus untuk emoji */
        gap: 10px; /* Jarak antara teks dan emoji */
      }
      
      #hasil-prediksi .emoji {
        font-size: 2em; /* Ukuran emoji */
        line-height: 1; /* Pastikan emoji tidak membuat tinggi baris aneh */
      }

      /* Sentiment Specific Colors (diubah total ke kontras hitam/putih/abu-abu) */
      /* Warna utama tetap untuk teks, tapi emoji akan memberi visual utama */
      .happy { color: #000000; } /* Teks hitam */
      .anger { color: #000000; }
      .fear { color: #000000; }
      .sadness { color: #000000; }
      .love { color: #000000; }
      .disgust { color: #000000; }
      /* Fallback for unknown/neutral/loading */
      .unknown, .neutral {
        color: #000000; /* Teks hitam */
      }

      /* Error Message Styles */
      .error-message {
        color: #CC0000; /* Merah gelap untuk error */
        margin-top: 15px;
        font-size: 0.9em;
        font-style: italic;
        text-transform: uppercase;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ANALISIS SENTIMEN TEKS INDONESIA</h1>
      <p>ALGORITMA SVM KONEKTIVITAS FLASK-VITE.</p>
      <p>MASUKKAN DATA UNTUK EVALUASI EMOSI.</p>
      
      <textarea id="teks-input" placeholder="TEKS MENTAH DI SINI. CONTOH: FILM INI SANGAT BAGUS."></textarea>

      <button id="analisis-btn">ANALISIS DATA</button>

      <div id="hasil-prediksi">PROSES: MENUNGGU DATA</div>
      <div class="error-message" id="error-msg"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
